name: Deploy to GitHub pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
          fetch-depth: 0 # Fetch all history
      - name: Copy documents and configurations
        run: |
          cp -v quartz.config.ts quartz.layout.ts quartz
          cp -rvf content/* quartz/content/
      - name: Install catppuccin theme
        run: |
          cd quartz
          mkdir -p quartz/styles/themes
          echo '@use "./base.scss";' > quartz/styles/custom.scss
          echo '// put your custom CSS here!' >> quartz/styles/custom.scss
          cat >> quartz/styles/custom.scss << 'EOF'
          
          :root {
            --title-scale: 1.25;
            --accent: #528bff;
            --accent-light: #7aa2ff;
            --accent-bg: #eef5ff;
            --card-bg: #ffffff;
            --border: #e6e9ef;
            --text: #282c34;
            --text-light: #5c6370;
            --bg: #fafafa;
          }
          
          body {
            background: var(--bg) !important;
          }
          
          h1, h2, h3, h4, h5, h6 {
            font-weight: 700 !important;
            line-height: 1.3 !important;
            margin-top: 1.6em !important;
            margin-bottom: 0.6em !important;
            color: var(--text) !important;
          }
          
          h1 {
            font-size: 2.2rem !important;
            margin-top: 0 !important;
          }
          
          h2 {
            font-size: 1.8rem !important;
            border-bottom: 2px solid var(--border) !important;
            padding-bottom: 0.4em !important;
          }
          
          h3 {
            font-size: 1.5rem !important;
            color: var(--text-light) !important;
          }
          
          h4 {
            font-size: 1.25rem !important;
            color: var(--text-light) !important;
          }
          
          .article-title {
            font-size: 2.5rem !important;
            font-weight: 800 !important;
          }
          
          article {
            background: var(--card-bg) !important;
            padding: 2.5em !important;
            border-radius: 12px !important;
            border: 1px solid var(--border) !important;
          }
          
          article p {
            text-indent: 2em !important;
            line-height: 1.8 !important;
            margin-top: 0.9em !important;
            margin-bottom: 0.9em !important;
            color: var(--text) !important;
          }
          
          article a {
            color: var(--accent) !important;
            text-decoration: none !important;
            border-bottom: 1px solid rgba(82, 139, 255, 0.3) !important;
            transition: all 0.2s ease !important;
          }
          
          article a:hover {
            color: var(--accent-light) !important;
            border-bottom-color: var(--accent-light) !important;
          }
          
          article ul,
          article ol {
            margin-left: 2em !important;
            line-height: 1.8 !important;
          }
          
          article li {
            margin: 0.4em 0 !important;
            color: var(--text) !important;
          }
          
          article blockquote {
            margin: 1.5em 0 !important;
            padding: 1.2em 1.5em !important;
            background: #f3f4f6 !important;
            border-left: 4px solid var(--accent) !important;
            border-radius: 0 8px 8px 0 !important;
            color: var(--text-light) !important;
          }
          
          article code {
            background: #f0f0f0 !important;
            padding: 0.2em 0.5em !important;
            border-radius: 4px !important;
            color: #e06c75 !important;
            font-size: 0.9em !important;
            font-family: "JetBrains Mono", "Fira Code", monospace !important;
          }
          
          article pre {
            background: #282c34 !important;
            border-radius: 8px !important;
            padding: 1.4em !important;
            overflow-x: auto !important;
          }
          
          article pre code {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            color: #abb2bf !important;
          }
          
          .explorer {
            background: #ffffff !important;
            border-right: 1px solid var(--border) !important;
          }
          
          .explorer-item {
            padding: 0.5em 1em !important;
            margin: 0.2em 0.5em !important;
            border-radius: 6px !important;
            transition: all 0.15s ease !important;
            color: var(--text-light) !important;
          }
          
          .explorer-item:hover {
            background: #f0f0f0 !important;
            color: var(--text) !important;
          }
          
          .explorer-item.active {
            background: var(--accent-bg) !important;
            color: var(--accent) !important;
            font-weight: 600 !important;
          }
          
          @media (prefers-color-scheme: dark) {
            :root {
              --accent-bg: #2c313a;
              --card-bg: #21252b;
              --border: #3e4451;
              --text: #abb2bf;
              --text-light: #7f848e;
              --bg: #282c34;
            }
          }
          
          .dark {
            --accent-bg: #2c313a;
            --card-bg: #21252b;
            --border: #3e4451;
            --text: #abb2bf;
            --text-light: #7f848e;
            --bg: #282c34;
          }
          
          .dark article {
            background: var(--card-bg) !important;
            border-color: var(--border) !important;
          }
          
          .dark article p,
          .dark article li {
            color: var(--text) !important;
          }
          
          .dark h1, .dark h2, .dark h3, .dark h4 {
            color: var(--text) !important;
          }
          
          .dark h2 {
            border-color: var(--border) !important;
          }
          
          .dark article code {
            background: #3e4451 !important;
            color: #e06c75 !important;
          }
          
          .dark article blockquote {
            background: #3e4451 !important;
            color: var(--text) !important;
          }
          
          .dark .explorer {
            background: #21252b !important;
            border-color: var(--border) !important;
          }
          
          .dark .explorer-item {
            color: var(--text-light) !important;
          }
          
          .dark .explorer-item:hover {
            background: #3e4451 !important;
            color: var(--text) !important;
          }
          
          .dark .explorer-item.active {
            background: rgba(82, 139, 255, 0.2) !important;
            color: var(--accent) !important;
          }
          EOF
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: quartz/package-lock.json
      - name: Install Node.js dependencies
        working-directory: quartz
        run: npm ci --omit=dev
      - name: Build website
        run: npx quartz build
        working-directory: quartz
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

  # Deployment job
  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main'}}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
