name: Deploy to GitHub pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
          fetch-depth: 0 # Fetch all history
      - name: Copy documents and configurations
        run: |
          cp -v quartz.config.ts quartz.layout.ts quartz
          cp -rvf content/* quartz/content/
      - name: Install catppuccin theme
        run: |
          cd quartz
          mkdir -p quartz/styles/themes
          curl -s -S -L "https://raw.githubusercontent.com/saberzero1/quartz-themes/master/themes/catppuccin/_index.scss" -o quartz/styles/themes/_index.scss
          curl -s -S -L "https://raw.githubusercontent.com/saberzero1/quartz-themes/master/themes/catppuccin/README.md" -o quartz/styles/themes/README.md
          curl -s -S -L "https://raw.githubusercontent.com/saberzero1/quartz-themes/master/themes/catppuccin/publish.css" -o quartz/styles/themes/publish.css
          echo '@use "./base.scss";' > quartz/styles/custom.scss
          echo '@use "./themes";' >> quartz/styles/custom.scss
          echo '// put your custom CSS here!' >> quartz/styles/custom.scss
          cat >> quartz/styles/custom.scss << 'EOF'
          
          :root {
            --title-scale: 1.25;
          }
          
          h1, h2, h3, h4, h5, h6 {
            font-weight: 700 !important;
            line-height: 1.2 !important;
            margin-top: 1.5em !important;
            margin-bottom: 0.5em !important;
          }
          
          h1 {
            font-size: 2.2rem !important;
          }
          
          h2 {
            font-size: 1.8rem !important;
          }
          
          h3 {
            font-size: 1.5rem !important;
          }
          
          h4 {
            font-size: 1.25rem !important;
          }
          
          .article-title {
            font-size: 2.5rem !important;
            font-weight: 800 !important;
          }
          
          article p {
            text-indent: 2em !important;
            line-height: 1.75 !important;
            margin-top: 0.8em !important;
            margin-bottom: 0.8em !important;
            text-align: justify !important;
          }
          
          article ul,
          article ol {
            margin-left: 2em !important;
            line-height: 1.7 !important;
          }
          
          article blockquote {
            margin-left: 1.5em !important;
            padding-left: 1.5em !important;
            border-left: 4px solid var(--light) !important;
          }
          EOF
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: quartz/package-lock.json
      - name: Install Node.js dependencies
        working-directory: quartz
        run: npm ci --omit=dev
      - name: Build website
        run: npx quartz build
        working-directory: quartz
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

  # Deployment job
  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main'}}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
