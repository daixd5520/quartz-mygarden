name: Deploy to GitHub pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
          fetch-depth: 0 # Fetch all history
      - name: Copy documents and configurations
        run: |
          cp -v quartz.config.ts quartz.layout.ts quartz
          cp -rvf content/* quartz/content/
      - name: Install catppuccin theme
        run: |
          cd quartz
          mkdir -p quartz/styles/themes
          curl -s -S -L "https://raw.githubusercontent.com/saberzero1/quartz-themes/master/themes/catppuccin/_index.scss" -o quartz/styles/themes/_index.scss
          curl -s -S -L "https://raw.githubusercontent.com/saberzero1/quartz-themes/master/themes/catppuccin/README.md" -o quartz/styles/themes/README.md
          curl -s -S -L "https://raw.githubusercontent.com/saberzero1/quartz-themes/master/themes/catppuccin/publish.css" -o quartz/styles/themes/publish.css
          echo '@use "./base.scss";' > quartz/styles/custom.scss
          echo '@use "./themes";' >> quartz/styles/custom.scss
          echo '// put your custom CSS here!' >> quartz/styles/custom.scss
          cat >> quartz/styles/custom.scss << 'EOF'
          
          :root {
            --title-scale: 1.25;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-bg: #eff6ff;
            --card-bg: #ffffff;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --border: #e5e7eb;
          }
          
          html {
            background: #f8fafc;
          }
          
          h1, h2, h3, h4, h5, h6 {
            font-weight: 700 !important;
            line-height: 1.3 !important;
            margin-top: 1.6em !important;
            margin-bottom: 0.6em !important;
            color: #0f172a !important;
          }
          
          h1 {
            font-size: 2.2rem !important;
            color: #1e293b !important;
            margin-top: 0 !important;
          }
          
          h2 {
            font-size: 1.8rem !important;
            color: #334155 !important;
            border-bottom: 2px solid var(--border) !important;
            padding-bottom: 0.4em !important;
          }
          
          h3 {
            font-size: 1.5rem !important;
            color: #475569 !important;
          }
          
          h4 {
            font-size: 1.25rem !important;
            color: #64748b !important;
          }
          
          .article-title {
            font-size: 2.5rem !important;
            font-weight: 800 !important;
            color: #0f172a !important;
          }
          
          article {
            background: var(--card-bg) !important;
            padding: 2.5em !important;
            border-radius: 12px !important;
            border: 1px solid var(--border) !important;
          }
          
          article p {
            text-indent: 2em !important;
            line-height: 1.8 !important;
            margin-top: 0.9em !important;
            margin-bottom: 0.9em !important;
            color: #334155 !important;
          }
          
          article a {
            color: var(--accent) !important;
            text-decoration: none !important;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3) !important;
            transition: all 0.2s ease !important;
          }
          
          article a:hover {
            color: var(--accent-light) !important;
            border-bottom-color: var(--accent-light) !important;
          }
          
          article ul,
          article ol {
            margin-left: 2em !important;
            line-height: 1.8 !important;
          }
          
          article li {
            margin: 0.4em 0 !important;
            color: #334155 !important;
          }
          
          article blockquote {
            margin: 1.5em 0 !important;
            padding: 1.2em 1.5em !important;
            background: #f8fafc !important;
            border-left: 4px solid var(--accent) !important;
            border-radius: 0 8px 8px 0 !important;
            color: #475569 !important;
          }
          
          article code {
            background: #f1f5f9 !important;
            padding: 0.2em 0.5em !important;
            border-radius: 4px !important;
            color: #475569 !important;
            font-size: 0.9em !important;
            border: 1px solid #e2e8f0 !important;
          }
          
          article pre {
            background: #0f172a !important;
            border-radius: 8px !important;
            padding: 1.2em !important;
            border: 1px solid #334155 !important;
            overflow-x: auto !important;
          }
          
          article pre code {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            color: #e2e8f0 !important;
          }
          
          .explorer {
            background: #ffffff !important;
            border-right: 1px solid var(--border) !important;
          }
          
          .explorer-item {
            padding: 0.5em 1em !important;
            margin: 0.2em 0.5em !important;
            border-radius: 6px !important;
            transition: all 0.15s ease !important;
            color: #475569 !important;
          }
          
          .explorer-item:hover {
            background: #f1f5f9 !important;
            color: #1e293b !important;
          }
          
          .explorer-item.active {
            background: var(--accent-bg) !important;
            color: var(--accent) !important;
            font-weight: 600 !important;
          }
          
          .dark article {
            background: #1e293b !important;
            border-color: #334155 !important;
          }
          
          .dark article p,
          .dark article li {
            color: #cbd5e1 !important;
          }
          
          .dark h1, .dark h2, .dark h3, .dark h4 {
            color: #f1f5f9 !important;
          }
          
          .dark h2 {
            border-color: #334155 !important;
          }
          
          .dark article code {
            background: #334155 !important;
            border-color: #475569 !important;
            color: #e2e8f0 !important;
          }
          
          .dark article blockquote {
            background: #334155 !important;
            color: #cbd5e1 !important;
          }
          
          .dark .explorer {
            background: #0f172a !important;
            border-color: #334155 !important;
          }
          
          .dark .explorer-item {
            color: #94a3b8 !important;
          }
          
          .dark .explorer-item:hover {
            background: #1e293b !important;
            color: #f1f5f9 !important;
          }
          
          .dark .explorer-item.active {
            background: rgba(59, 130, 246, 0.2) !important;
            color: #60a5fa !important;
          }
          EOF
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: quartz/package-lock.json
      - name: Install Node.js dependencies
        working-directory: quartz
        run: npm ci --omit=dev
      - name: Build website
        run: npx quartz build
        working-directory: quartz
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

  # Deployment job
  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main'}}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
